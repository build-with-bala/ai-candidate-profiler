/* ============ tokens — committed dark instrument world ============ */
:root{
  --ground:#0E121B; --surface:#151B27; --raised:#1B2332; --line:#232D40; --line-soft:#1C2536;
  --ink:#E9E4D8; --muted:#8A93A6; --faint:#5A6478;
  --gold:#D9A441; --gold-bright:#E8BC66; --gold-dim:#8A6A2C;
  --cc:#D96A46; --codex:#24A893; --cursor:#B96DD8; --antigravity:#74A23E; --copilot:#3E8CD9;
  --hm0:#161D2B; --hm1:#3E3620; --hm2:#6E5524; --hm3:#A67E2F; --hm4:#E0B25C;
  --disp:"Archivo",system-ui,sans-serif;
  --mono:"JBMono","SF Mono",Consolas,monospace;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(ellipse 90% 60% at 50% -10%,#18202f 0%,var(--ground) 60%);background-repeat:no-repeat}
::selection{background:var(--gold-dim);color:#fff}
a{color:var(--gold-bright)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}

.wrap{max-width:1140px;margin:0 auto;padding:0 28px}

/* ============ masthead ============ */
.mast{padding:52px 0 30px;display:flex;gap:36px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.mast-left{min-width:280px;flex:1}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold)}
.candidate{font-family:var(--disp);font-stretch:125%;font-weight:800;text-transform:uppercase;
  font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:.01em;margin-top:14px;text-wrap:balance}
.mast-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 22px}
.mast-meta b{color:var(--ink);font-weight:400}
.personas{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:8px;max-width:840px}
.persona{border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:3px;display:flex;gap:10px;align-items:flex-start}
.persona .p-ico{width:21px;height:21px;flex-shrink:0;color:var(--faint);margin-top:1px}
.persona .p-ico svg{width:100%;height:100%;display:block}
.persona .p-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.persona .p-facet{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.persona .p-name{font-family:var(--disp);font-stretch:125%;font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.persona .p-tag{font-size:10.5px;color:var(--muted);line-height:1.4}
.persona.prime{border-color:var(--gold-dim)}
.persona.prime .p-ico{color:var(--gold)}
.persona.prime .p-name{color:var(--gold-bright)}
.persona.prime .p-facet{color:var(--gold)}
.persona:not(.prime){opacity:.8}

/* the assay seal */
.seal{width:196px;height:196px;position:relative;flex-shrink:0;transform:rotate(-7deg)}
.seal svg{width:100%;height:100%;overflow:visible}
.seal .ring-text{font-family:var(--mono);font-size:9.2px;letter-spacing:.28em;fill:var(--gold);text-transform:uppercase}
.seal .score-num{font-family:var(--disp);font-stretch:125%;font-weight:800;font-size:52px;fill:var(--ink)}
.seal .score-of{font-family:var(--mono);font-size:10px;fill:var(--faint);letter-spacing:.15em}
.seal .band-txt{font-family:var(--mono);font-size:9px;fill:var(--gold-bright);letter-spacing:.12em;text-transform:uppercase}
.seal .gauge-bg{stroke:var(--line);fill:none}
.seal .gauge-fg{stroke:var(--gold);fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1)}

/* ============ nav ============ */
.nav{position:sticky;top:0;z-index:40;background:rgba(14,18,27,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--gold-bright);border-bottom-color:var(--gold)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:4px;padding-right:4px}
.nav-actions button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint);padding:12px 10px;text-transform:uppercase}
.nav-actions button:hover{color:var(--gold-bright)}

/* ============ panels / sections ============ */
.panel{display:none;padding:34px 0 60px}
.panel.on{display:block}
.sect{margin-top:40px}
.sect:first-child{margin-top:0}
.sect-h{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.sect-sub{font-size:13px;color:var(--muted);margin:-10px 0 18px;max-width:68ch}

/* signal strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px 16px 13px}
.tile .t-num{font-family:var(--disp);font-stretch:125%;font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile .t-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.tile .t-sub{font-size:11.5px;color:var(--faint);margin-top:3px}

/* radar + axes */
.profile-grid{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
@media(max-width:840px){.profile-grid{grid-template-columns:1fr}}
.radar-box{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px}
.radar-box svg{width:100%;height:auto;display:block}
.radar .grid-line{stroke:var(--line);fill:none}
.radar .spoke{stroke:var(--line-soft)}
.radar .shape{fill:rgba(217,164,65,.16);stroke:var(--gold);stroke-width:1.6}
.radar .vertex{fill:var(--gold-bright)}
.radar .ax-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.radar .ax-val{font-family:var(--mono);font-size:9.5px;fill:var(--gold-bright)}
.axes{display:flex;flex-direction:column;gap:14px}
.axis-row{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:13px 16px}
.axis-top{display:flex;align-items:baseline;gap:12px}
.axis-name{font-family:var(--disp);font-stretch:125%;font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;width:150px;flex-shrink:0}
.axis-bar{flex:1;height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.axis-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:3px;
  transition:width 1.1s cubic-bezier(.22,1,.36,1);width:0}
.axis-score{font-family:var(--mono);font-size:13px;color:var(--gold-bright);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.axis-ev{font-size:12.5px;color:var(--muted);margin-top:7px;padding-left:162px}
@media(max-width:700px){.axis-ev{padding-left:0}.axis-name{width:110px}}

/* heatmap */
.hm-box{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px;overflow-x:auto}
.hm-scroll{min-width:760px}
.hm-months{display:grid;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin:0 0 6px 30px;text-transform:uppercase;letter-spacing:.08em}
.hm-body{display:flex;gap:8px}
.hm-dow{display:grid;grid-template-rows:repeat(7,11px);row-gap:3px;font-family:var(--mono);font-size:9px;color:var(--faint);width:22px}
.hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;flex:1}
.hm-cell{width:11px;height:11px;border-radius:2px;background:var(--hm0)}
.hm-cell[data-l="1"]{background:var(--hm1)}
.hm-cell[data-l="2"]{background:var(--hm2)}
.hm-cell[data-l="3"]{background:var(--hm3)}
.hm-cell[data-l="4"]{background:var(--hm4)}
.hm-cell:hover{outline:1px solid var(--gold-bright)}
.hm-legend{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:12px;justify-content:flex-end}
.hm-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}

/* tool mix stacked bar */
.mix-bar{display:flex;height:26px;border-radius:3px;overflow:hidden;gap:2px;background:var(--ground)}
.mix-seg{min-width:3px}
.mix-legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:12px}
.mix-item{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.mix-item i{width:9px;height:9px;border-radius:2px;flex-shrink:0;align-self:center}
.mix-item b{color:var(--ink);font-weight:400}

/* arsenal cards */
.arsenal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.t-card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;text-align:left;
  display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--tc,var(--line));transition:background .15s}
.t-card:hover{background:var(--raised)}
.t-card .tc-name{font-family:var(--disp);font-stretch:125%;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.status{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:3px 8px;border-radius:2px;align-self:flex-start}
.status.active{color:#0E121B;background:var(--gold);font-weight:700}
.status.dormant{color:var(--gold-bright);border:1px solid var(--gold-dim)}
.status.installed{color:var(--muted);border:1px solid var(--line)}
.status.not_found{color:var(--faint);border:1px dashed var(--line)}
.tc-stats{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.tc-stats b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.tc-when{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:auto}

/* findings */
.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.f-col{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px}
.f-col h3{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
.f-col.str h3{color:#7FBE8E}.f-col.rsk h3{color:#D9A441}.f-col.qst h3{color:var(--muted)}
.f-col ul{list-style:none;display:flex;flex-direction:column;gap:11px}
.f-col li{font-size:13px;color:var(--ink);padding-left:16px;position:relative;line-height:1.5}
.f-col li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:1px}
.f-col.str li::before{background:#7FBE8E}.f-col.rsk li::before{background:var(--gold)}.f-col.qst li::before{background:var(--faint)}
.f-col.qst li{color:var(--muted)}

/* tool panels */
.tp-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.tp-name{font-family:var(--disp);font-stretch:125%;font-weight:800;font-size:32px;text-transform:uppercase;letter-spacing:.01em}
.tp-when{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.m-cell{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px}
.m-cell .m-val{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;word-break:break-word}
.m-cell .m-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.m-cell .m-hint{font-size:11px;color:var(--faint);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:190px 1fr 60px;gap:12px;align-items:center;font-family:var(--mono);font-size:12px}
.bar-row .b-lbl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.bar-row .b-track{height:14px;background:var(--raised);border-radius:2px;overflow:hidden}
.bar-row .b-fill{height:100%;border-radius:2px 3px 3px 2px;background:var(--bc,var(--gold))}
.bar-row .b-val{color:var(--ink);font-variant-numeric:tabular-nums}
@media(max-width:600px){.bar-row{grid-template-columns:110px 1fr 52px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:4px 9px}
.note{font-size:12px;color:var(--faint);border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-top:8px}
.hour-chart{display:flex;align-items:flex-end;gap:3px;height:70px}
.hour-col{flex:1;background:var(--tc,var(--gold));opacity:.85;border-radius:2px 2px 0 0;min-height:1px}
.hour-lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:6px}
.empty-tool{padding:40px;text-align:center;color:var(--faint);background:var(--surface);border:1px dashed var(--line);border-radius:3px;font-family:var(--mono);font-size:13px}

/* methodology */
.method table{width:100%;border-collapse:collapse;font-size:12.5px}
.method th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.method td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink);vertical-align:top}
.method td.mono{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.method .tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 4px}
.priv{background:var(--surface);border:1px solid var(--gold-dim);border-radius:3px;padding:18px;font-size:13px;color:var(--ink)}
.priv b{color:var(--gold-bright)}

/* tooltip */
#tip{position:fixed;pointer-events:none;background:#0A0E15;border:1px solid var(--gold-dim);color:var(--ink);
  font-family:var(--mono);font-size:11.5px;padding:7px 10px;border-radius:3px;z-index:99;display:none;max-width:260px;line-height:1.5}

/* footer */
.foot{border-top:1px solid var(--line);padding:22px 0 40px;font-family:var(--mono);font-size:11px;color:var(--faint);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ============ print ============ */
@media print{
  :root{--ground:#fff;--surface:#f6f4ee;--raised:#eceadf;--line:#d8d4c8;--line-soft:#e4e0d4;
    --ink:#1c1a14;--muted:#5c584c;--faint:#8a8578;--hm0:#eceade;
    --gold:#9a742a;--gold-bright:#7a5a1e;--gold-dim:#c0a464}
  body{background:#fff}
  .nav,.nav-actions,#tip{display:none!important}
  .panel{display:block!important;page-break-inside:avoid;padding:20px 0}
  .seal{transform:rotate(-7deg) scale(.9)}
}
</style>
</head>
<body>

<div id="tip" role="tooltip"></div>

<header class="wrap mast">
  <div class="mast-left">
    <div class="eyebrow">AI Leverage Dossier · Developer Telemetry</div>
    <h1 class="candidate" id="candName">—</h1>
    <div class="mast-meta" id="mastMeta"></div>
    <div class="personas" id="personas"></div>
  </div>
  <div class="seal" id="seal" aria-label="Overall score"></div>
</header>

<nav class="nav" aria-label="Report sections">
  <div class="wrap nav-inner" role="tablist" id="tabbar"></div>
</nav>

<main class="wrap" id="panels"></main>

<footer class="wrap foot">
  <span id="footLeft"></span>
  <span>Aggregates only — no prompt text, code, or credentials were read or included.</span>
</footer>

<script id="data" type="application/json">"__PROFILE_DATA__"</script>
<script>
"use strict";
const P = JSON.parse(document.getElementById("data").textContent);
if (typeof P === "string") {
  document.getElementById("panels").innerHTML =
    '<div class="empty-tool" style="margin:60px 0">No profile data injected — run the profiler executable to generate a report.</div>';
  throw new Error("no data");
}

const TOOL_ORDER = ["claudeCode","codex","cursor","antigravity","copilot"];
const TOOL_COLOR = {claudeCode:"var(--cc)",codex:"var(--codex)",cursor:"var(--cursor)",antigravity:"var(--antigravity)",copilot:"var(--copilot)"};
const TOOL_SHORT = {claudeCode:"Claude Code",codex:"Codex",cursor:"Cursor",antigravity:"Antigravity",copilot:"Copilot"};
const byId = {}; P.tools.forEach(t => byId[t.id] = t);
const tools = TOOL_ORDER.map(id => byId[id]).filter(Boolean);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e4 ? Math.round(n/1e3)+"k" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—";

/* ---------- masthead ---------- */
document.title = P.meta.candidate + " · AI Leverage Dossier";
document.getElementById("candName").textContent = P.meta.candidate;
const ICONS = {
  "The Orchestrator":'<circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="12" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M12 7.2v3.5M12 10.7 5.8 16M12 10.7v5.1M12 10.7l6.2 5.3"/>',
  "The Architect":'<rect x="4" y="4" width="16" height="16"/><path d="M4 20 20 4M10 4v6H4"/>',
  "The Platform Engineer":'<path d="M12 3 21 8l-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/>',
  "The DevOps Engineer":'<path d="M4 12a8 8 0 0 1 14-5"/><path d="M18 3.5v3.5h-3.5"/><path d="M20 12a8 8 0 0 1-14 5"/><path d="M6 20.5V17h3.5"/>',
  "The SRE":'<path d="M3 12h4l2.2-6 4.2 12 2.2-6H21"/>',
  "The Data Engineer":'<ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13"/><path d="M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>',
  "The Database Admin":'<ellipse cx="11" cy="5.5" rx="6.5" ry="2.5"/><path d="M4.5 5.5v12c0 1.4 2.9 2.5 6.5 2.5 1 0 2-.1 2.8-.3M17.5 5.5V11"/><path d="M15 16.5l2.3 2.3 3.7-3.7"/>',
  "The ML Engineer":'<circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M6.8 11.1 17.2 5.9M6.8 12.9l10.4 5.2"/>',
  "The AI Engineer":'<path d="M11 3l1.7 4.8L17.5 9.5l-4.8 1.7L11 16l-1.7-4.8L4.5 9.5l4.8-1.7L11 3z"/><circle cx="18.5" cy="17.5" r="2.2"/>',
  "The Prompt Engineer":'<path d="M4 5h16v11H9.5L4 20V5z"/><path d="M7.5 9l2.5 2-2.5 2M12.5 13h4"/>',
  "The Frontend Engineer":'<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 8.5h18"/><circle cx="6" cy="6.2" r=".9" fill="currentColor" stroke="none"/>',
  "The Backend Engineer":'<rect x="4" y="4" width="16" height="7" rx="1"/><rect x="4" y="13" width="16" height="7" rx="1"/><circle cx="8" cy="7.5" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="16.5" r=".9" fill="currentColor" stroke="none"/>',
  "The Full-Stack Engineer":'<rect x="3" y="3" width="13" height="13" rx="1.5"/><rect x="8" y="8" width="13" height="13" rx="1.5"/>',
  "The Mobile Engineer":'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10.5 18.5h3"/>',
  "The Systems Programmer":'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9.5 7V4M14.5 7V4M9.5 20v-3M14.5 20v-3M7 9.5H4M7 14.5H4M20 9.5h-3M20 14.5h-3"/>',
  "The Automation Scripter":'<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 9l3 3-3 3M12.5 15H17"/>',
  "The QA Engineer":'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.6 2.6L16.5 9"/>',
  "The Security Engineer":'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>',
  "The Network Engineer":'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M11 6.8 6 17.2M13 6.8l5 10.4M7 19h10"/>',
  "The Toolsmith":'<path d="M14.5 6.5a4 4 0 0 0-5.6 4.6L4 16l4 4 4.9-4.9a4 4 0 0 0 4.6-5.6L14 13l-3-3 3.5-3.5z"/>',
  "The Integrator":'<path d="M9.5 14.5l5-5"/><path d="M11 7l2-2a4 4 0 0 1 6 6l-2 2M13 17l-2 2a4 4 0 0 1-6-6l2-2"/>',
  "The Product Owner":'<path d="M6 21V4"/><path d="M6 4h12l-3 4 3 4H6"/>',
  "The Tech Lead":'<circle cx="12" cy="7.5" r="3"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/><circle cx="19.5" cy="10.5" r="1.4"/><circle cx="4.5" cy="10.5" r="1.4"/>',
  "The Documentarian":'<path d="M6 3h9l4 4v14H6V3z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>',
  "The Debugger":'<ellipse cx="12" cy="13.5" rx="5" ry="6"/><path d="M12 7.5V4.5M8.4 9 6 6.5M15.6 9 18 6.5M7 13.5H4M20 13.5h-3M8.4 18 6 20.5M15.6 18 18 20.5"/>',
  "The Refactorer":'<path d="M8 4C6.5 4 6.5 6 6.5 8s0 4-2.5 4c2.5 0 2.5 2 2.5 4s0 4 1.5 4"/><path d="M16 4c1.5 0 1.5 2 1.5 4s0 4 2.5 4c-2.5 0-2.5 2-2.5 4s0 4-1.5 4"/><path d="M10 12h4"/>',
  "The Code Auditor":'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M8.2 9.5h4.6M8.2 12h3"/>',
  "The Polyglot":'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 2.5 3 14.5 0 17-3-2.5-3-14.5 0-17z"/>',
  "The Early Adopter":'<path d="M12 3c3 2.5 4.5 6.5 4.5 10.5L12 16l-4.5-2.5C7.5 9.5 9 5.5 12 3z"/><circle cx="12" cy="9.5" r="1.5"/><path d="M9.2 17.5 8 21M14.8 17.5 16 21"/>',
  "The Ghost":'<circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/>',
  "The Generalist":'<circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3"/>'
};
const icoSvg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || '<circle cx="12" cy="12" r="8.5"/>'}</svg>`;
document.getElementById("personas").innerHTML = (P.personas || [Object.assign({facet:"profile"}, P.archetype)]).map((p, i) =>
  `<span class="persona${i < 3 ? " prime" : ""}"><span class="p-ico">${icoSvg(p.name)}</span><span class="p-body"><span class="p-facet">${esc(p.facet)}</span><span class="p-name">${esc(p.name)}</span><span class="p-tag">${esc(p.tagline)}</span></span></span>`).join("");
document.getElementById("mastMeta").innerHTML = [
  ["machine", esc(P.meta.hostname || P.meta.machineUser)],
  ["os", esc(P.meta.os)],
  ["scanned", new Date(P.meta.scanDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})],
  ["profiler", "v" + esc(P.meta.toolVersion) + (P.meta.redacted ? " · redacted" : "")]
].map(([k,v]) => `<span>${k} <b>${v}</b></span>`).join("");
document.getElementById("footLeft").textContent =
  `Generated ${new Date(P.meta.scanDate).toLocaleString("en-GB")} · scan ${P.meta.scanSeconds}s · AI Candidate Profiler v${P.meta.toolVersion}`;

/* ---------- assay seal ---------- */
(function seal(){
  const r = 70, c = 98, circ = 2 * Math.PI * r;
  const target = circ * (1 - P.overall / 100);
  const el = document.getElementById("seal");
  el.innerHTML = `
  <svg viewBox="0 0 196 196">
    <defs><path id="ringPath" d="M 98,20 a 78,78 0 1,1 -0.01,0" /></defs>
    <circle cx="${c}" cy="${c}" r="92" fill="none" stroke="var(--gold-dim)" stroke-width="1" opacity=".6"/>
    <circle cx="${c}" cy="${c}" r="88" fill="none" stroke="var(--gold-dim)" stroke-width=".5" opacity=".4"/>
    <text class="ring-text"><textPath href="#ringPath">AI LEVERAGE ASSAY · DEVELOPER TELEMETRY · EVIDENCE-BASED ·</textPath></text>
    <circle class="gauge-bg" cx="${c}" cy="${c}" r="${r}" stroke-width="5"/>
    <circle class="gauge-fg" cx="${c}" cy="${c}" r="${r}" stroke-width="5"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ}" transform="rotate(-90 ${c} ${c})"/>
    <text class="score-num" x="${c}" y="${c+6}" text-anchor="middle" id="sealNum">0</text>
    <text class="score-of" x="${c}" y="${c+23}" text-anchor="middle">/ 100</text>
    ${P.verdict.band.split(" ").map((w,i) =>
      `<text class="band-txt" x="${c}" y="${c+38+i*12}" text-anchor="middle">${esc(w)}</text>`).join("")}
  </svg>`;
  const fg = el.querySelector(".gauge-fg"), num = el.querySelector("#sealNum");
  if (reduceMotion) { fg.style.transition = "none"; fg.setAttribute("stroke-dashoffset", target); num.textContent = P.overall; return; }
  requestAnimationFrame(() => requestAnimationFrame(() => fg.setAttribute("stroke-dashoffset", target)));
  const t0 = performance.now();
  (function tick(t){ const p = Math.min((t - t0) / 1300, 1);
    num.textContent = Math.round(P.overall * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick); })(t0);
})();

/* ---------- tabs ---------- */
const SECTIONS = [{id:"overview",label:"Overview"}]
  .concat(tools.map(t => ({id:t.id,label:TOOL_SHORT[t.id],dot:TOOL_COLOR[t.id],dim:t.status==="not_found"})))
  .concat([{id:"method",label:"Method"}]);
const tabbar = document.getElementById("tabbar");
tabbar.innerHTML = SECTIONS.map(s =>
  `<button class="tab" role="tab" aria-selected="false" data-p="${s.id}" ${s.dim?'style="opacity:.45"':""}>
    ${s.dot?`<span class="dot" style="background:${s.dot}"></span>`:""}${esc(s.label)}</button>`).join("") +
  `<span class="nav-actions"><button id="btnPrint" title="Print / save as PDF">Print</button></span>`;
const panelsEl = document.getElementById("panels");
panelsEl.innerHTML = SECTIONS.map(s => `<section class="panel" id="p-${s.id}" role="tabpanel"></section>`).join("");
function show(id){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.p === id)));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + id));
  if (history.replaceState) history.replaceState(null, "", "#" + id);
  if (id === "overview") animateOverview();
}
tabbar.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.p); });
document.getElementById("btnPrint").addEventListener("click", () => print());

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function tipShow(html, x, y){ tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth; tip.style.left = Math.min(x + 14, innerWidth - w - 12) + "px"; tip.style.top = (y + 16) + "px"; }
function tipHide(){ tip.style.display = "none"; }
document.addEventListener("scroll", tipHide, true);

/* ---------- overview panel ---------- */
(function overview(){
  const el = document.getElementById("p-overview");
  el.classList.add("on");
  const T = P.totals;

  // signal strip
  const tiles = [
    {n:T.prompts, l:"Prompts sent", s:"all tools, lifetime"},
    {n:T.activeDays, l:"Active days", s:T.d90 + " in the last 90"},
    {n:T.toolsActive, l:"Tools active", s:"of " + tools.length + " scanned"},
    {n:T.streak, l:"Longest streak", s:"consecutive days"},
    {n:T.tokens, l:"Tokens generated", s:"Claude Code output", fmt:true},
    {n:T.staleDays, l:"Days since last use", s:T.staleDays === 0 ? "used today" : "", inv:true},
  ];
  const strip = `<div class="strip">` + tiles.map(t =>
    `<div class="tile"><div class="t-num" data-count="${t.n}" data-fmt="${t.fmt?1:0}">0</div>
     <div class="t-lbl">${esc(t.l)}</div>${t.s?`<div class="t-sub">${esc(t.s)}</div>`:""}</div>`).join("") + `</div>`;

  // radar
  const AX_SHORT = {breadth:"Breadth",depth:"Depth",consistency:"Consistency",tech:"Technical",volume:"Volume",agentic:"Agentic",craft:"Craft"};
  const R = 108, CX = 160, CY = 145, N = P.axes.length;
  const pt = (i, v) => { const a = -Math.PI/2 + i * 2*Math.PI/N; return [CX + Math.cos(a)*R*v, CY + Math.sin(a)*R*v]; };
  let rings = "";
  for (let g = 1; g <= 4; g++){
    rings += `<polygon class="grid-line" points="${P.axes.map((_,i)=>pt(i,g/4).map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;
  }
  const spokes = P.axes.map((_,i)=>{const [x,y]=pt(i,1);return `<line class="spoke" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}).join("");
  const shapePts = P.axes.map((a,i)=>pt(i,Math.max(a.score,3)/100).map(n=>n.toFixed(1)).join(",")).join(" ");
  const verts = P.axes.map((a,i)=>{const [x,y]=pt(i,Math.max(a.score,3)/100);
    return `<circle class="vertex" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" data-ax="${i}"/>`}).join("");
  const lbls = P.axes.map((a,i)=>{const [x,y]=pt(i,1.18);
    const anchor = Math.abs(x-CX)<10?"middle":x>CX?"start":"end";
    return `<text class="ax-lbl" x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}">${esc(AX_SHORT[a.key]||a.label)}</text>
      <text class="ax-val" x="${x.toFixed(1)}" y="${(y+15).toFixed(1)}" text-anchor="${anchor}">${a.score}</text>`;}).join("");
  const radar = `<div class="radar-box"><svg class="radar" viewBox="-16 -4 356 310">${rings}${spokes}
    <polygon class="shape" points="${shapePts}"/>${verts}${lbls}</svg></div>`;

  const axes = `<div class="axes">` + P.axes.map(a => `
    <div class="axis-row"><div class="axis-top">
      <span class="axis-name">${esc(a.label)}</span>
      <div class="axis-bar"><div class="axis-fill" data-w="${a.score}"></div></div>
      <span class="axis-score">${a.score}</span></div>
      <div class="axis-ev">${esc(a.evidence)}</div></div>`).join("") + `</div>`;

  // heatmap — last 12 months
  const today = new Date(); today.setHours(12,0,0,0);
  const end = new Date(today); end.setDate(end.getDate() + (6 - end.getDay())); // pad to Saturday
  const start = new Date(end); start.setDate(start.getDate() - 7*53 + 1);
  let cells = "", maxDay = 1;
  const dayTotals = {};
  for (const [d, per] of Object.entries(P.daily)){
    const tot = Object.values(per).reduce((a,b)=>a+b,0);
    dayTotals[d] = {tot, per};
    if (tot > maxDay) maxDay = tot;
  }
  const lvl = n => n===0?0 : n<=Math.max(1,maxDay*.15)?1 : n<=maxDay*.4?2 : n<=maxDay*.7?3 : 4;
  const monthMarks = [];
  let lastMonth = -1;
  for (let w = 0; w < 53; w++){
    for (let dow = 0; dow < 7; dow++){
      const d = new Date(start); d.setDate(start.getDate() + w*7 + dow);
      if (d > today) { cells += `<span class="hm-cell" style="visibility:hidden"></span>`; continue; }
      const key = d.toISOString().slice(0,10);
      const rec = dayTotals[key];
      const tot = rec ? rec.tot : 0;
      if (dow === 0 && d.getMonth() !== lastMonth){ lastMonth = d.getMonth(); monthMarks.push([w, d.toLocaleDateString("en",{month:"short"})]); }
      cells += `<span class="hm-cell" data-l="${lvl(tot)}" data-d="${key}" data-n="${tot}"></span>`;
    }
  }
  const months = `<div class="hm-months" style="grid-template-columns:repeat(53,14px)">` +
    monthMarks.map(([w,m],i) => `<span style="grid-column:${w+1}">${i===0&&w>49?"":m}</span>`).join("") + `</div>`;
  const heatmap = `<div class="hm-box"><div class="hm-scroll">${months}
    <div class="hm-body"><div class="hm-dow"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
    <div class="hm-grid">${cells}</div></div>
    <div class="hm-legend">less <i style="background:var(--hm0)"></i><i style="background:var(--hm1)"></i><i style="background:var(--hm2)"></i><i style="background:var(--hm3)"></i><i style="background:var(--hm4)"></i> more</div>
  </div></div>`;

  // tool mix
  const mixCounts = tools.map(t => {
    const r = t.raw || {};
    const n = r.userPrompts ?? r.userMsgs ?? r.prompts ?? r.chatRequests ?? ((r.agentConversations||0)+(r.chatSessions||0)) ?? 0;
    return [t.id, n || 0];
  }).filter(([,n]) => n > 0);
  const mixTot = mixCounts.reduce((s,[,n])=>s+n,0) || 1;
  const mix = mixCounts.length ? `<div class="mix-bar">` +
    mixCounts.map(([id,n]) => `<div class="mix-seg" data-mix="${id}" style="flex:${n};background:${TOOL_COLOR[id]}"></div>`).join("") + `</div>
    <div class="mix-legend">` + mixCounts.map(([id,n]) =>
      `<span class="mix-item"><i style="background:${TOOL_COLOR[id]}"></i>${esc(TOOL_SHORT[id])} <b>${fmtN(n)}</b> · ${Math.round(100*n/mixTot)}%</span>`).join("") + `</div>` : "";

  // arsenal
  const arsenal = `<div class="arsenal">` + tools.map(t => {
    const r = t.raw || {};
    const two = (t.metrics || []).slice(0,3).map(m => `<span>${esc(m.label)} <b>${esc(String(m.value))}</b></span>`).join("");
    return `<button class="t-card" style="--tc:${TOOL_COLOR[t.id]}" data-go="${t.id}">
      <span class="tc-name">${esc(TOOL_SHORT[t.id])}</span>
      <span class="status ${t.status}">${t.status.replace("_"," ")}</span>
      <span class="tc-stats">${two || "<span>no local traces</span>"}</span>
      <span class="tc-when">${t.lastUsed ? "last used " + fmtDate(t.lastUsed) : t.status === "installed" ? "installed, unused" : "—"}</span>
    </button>`;
  }).join("") + `</div>`;

  // findings
  const F = P.findings;
  const findings = `<div class="findings">
    <div class="f-col str"><h3>Strengths</h3><ul>${F.strengths.map(s=>`<li>${esc(s)}</li>`).join("")||"<li>None evidenced yet.</li>"}</ul></div>
    <div class="f-col rsk"><h3>Watch list</h3><ul>${F.risks.map(s=>`<li>${esc(s)}</li>`).join("")||"<li>—</li>"}</ul></div>
    <div class="f-col qst"><h3>Interview probes</h3><ul>${F.questions.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
  </div>`;

  el.innerHTML = `
    <div class="sect"><div class="sect-h">Signal strip</div>${strip}</div>
    <div class="sect"><div class="sect-h">Competency profile</div>
      <p class="sect-sub">${esc(P.verdict.summary)}</p>
      <div class="profile-grid">${radar}${axes}</div></div>
    <div class="sect"><div class="sect-h">Activity — last 12 months</div>${heatmap}</div>
    ${mix ? `<div class="sect"><div class="sect-h">Tool mix</div><p class="sect-sub">Share of lifetime prompts by tool.</p>${mix}</div>` : ""}
    <div class="sect"><div class="sect-h">Arsenal</div>${arsenal}</div>
    <div class="sect"><div class="sect-h">Findings</div>${findings}</div>`;

  el.addEventListener("click", e => { const c = e.target.closest("[data-go]"); if (c) show(c.dataset.go); });
  el.addEventListener("mousemove", e => {
    const cell = e.target.closest(".hm-cell[data-d]");
    if (cell){
      const rec = dayTotals[cell.dataset.d];
      const per = rec ? Object.entries(rec.per).map(([id,n])=>`${TOOL_SHORT[id]} ${n}`).join(" · ") : "";
      tipShow(`<b>${fmtDate(cell.dataset.d)}</b><br>${cell.dataset.n} prompts${per?"<br>"+esc(per):""}`, e.clientX, e.clientY);
      return;
    }
    const seg = e.target.closest("[data-mix]");
    if (seg){ const id = seg.dataset.mix; const n = mixCounts.find(m=>m[0]===id)[1];
      tipShow(`<b>${TOOL_SHORT[id]}</b><br>${n.toLocaleString()} prompts · ${Math.round(100*n/mixTot)}%`, e.clientX, e.clientY); return; }
    const v = e.target.closest(".vertex");
    if (v){ const a = P.axes[+v.dataset.ax]; tipShow(`<b>${esc(a.label)} — ${a.score}</b><br>${esc(a.evidence)}`, e.clientX, e.clientY); return; }
    tipHide();
  });
  el.addEventListener("mouseleave", tipHide);
})();

let animated = false;
function animateOverview(){
  document.querySelectorAll(".axis-fill").forEach(f => f.style.width = f.dataset.w + "%");
  if (animated) return;
  animated = true;
  document.querySelectorAll(".t-num[data-count]").forEach(elN => {
    const target = +elN.dataset.count, useFmt = elN.dataset.fmt === "1";
    if (reduceMotion){ elN.textContent = useFmt ? fmtN(target) : target.toLocaleString(); return; }
    const t0 = performance.now();
    (function tick(t){ const p = Math.min((t - t0)/1100, 1);
      const v = Math.round(target * (1 - Math.pow(1 - p, 3)));
      elN.textContent = useFmt ? fmtN(v) : v.toLocaleString();
      if (p < 1) requestAnimationFrame(tick); })(t0);
  });
}
animateOverview();

/* ---------- per-tool panels ---------- */
function barList(entries, color, unit){
  if (!entries.length) return "";
  const max = Math.max(...entries.map(e => e[1]));
  return `<div class="bars">` + entries.map(([k,v]) =>
    `<div class="bar-row"><span class="b-lbl" title="${esc(k)}">${esc(k)}</span>
     <div class="b-track"><div class="b-fill" style="--bc:${color};width:${Math.max(2,100*v/max)}%"></div></div>
     <span class="b-val">${fmtN(v)}</span></div>`).join("") + `</div>`;
}
const topEntries = (obj, n) => Object.entries(obj || {}).sort((a,b) => b[1]-a[1]).slice(0, n);

for (const t of tools){
  const el = document.getElementById("p-" + t.id);
  const color = TOOL_COLOR[t.id];
  const r = t.raw || {};
  const head = `<div class="tp-head">
    <span class="tp-name" style="color:${color}">${esc(TOOL_SHORT[t.id])}</span>
    <span class="status ${t.status}">${t.status.replace("_"," ")}</span>
    <span class="tp-when">${t.firstUsed ? "first seen " + fmtDate(t.firstUsed) + " · " : ""}${t.lastUsed ? "last used " + fmtDate(t.lastUsed) : ""}</span>
  </div>`;
  if (t.status === "not_found"){
    el.innerHTML = head + `<div class="empty-tool">No local traces of ${esc(TOOL_SHORT[t.id])} were found on this machine.</div>`;
    continue;
  }
  const mgrid = `<div class="m-grid">` + (t.metrics||[]).map(m =>
    `<div class="m-cell"><div class="m-val">${esc(String(m.value))}</div><div class="m-lbl">${esc(m.label)}</div>
     ${m.hint?`<div class="m-hint">${esc(m.hint)}</div>`:""}</div>`).join("") + `</div>`;

  let extras = "";
  if (t.id === "claudeCode"){
    const tt = topEntries(r.toolCounts, 10).map(([k,v])=>[k.startsWith("mcp__")?"mcp: "+k.split("__").pop():k,v]), mm = topEntries(r.models, 6);
    if (tt.length) extras += `<div class="sect"><div class="sect-h">Tools the agent ran</div>${barList(tt, color)}</div>`;
    if (mm.length) extras += `<div class="sect"><div class="sect-h">Models</div>${barList(mm, color)}</div>`;
    if (r.hourHist && r.hourHist.some(v=>v)){
      const mx = Math.max(...r.hourHist);
      extras += `<div class="sect"><div class="sect-h">Hour of day</div><div class="hour-chart" style="--tc:${color}">` +
        r.hourHist.map((v,h)=>`<div class="hour-col" data-h="${h}" data-v="${v}" style="height:${Math.max(2,100*v/mx)}%"></div>`).join("") +
        `</div><div class="hour-lbls"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>`;
    }
    if (r.editedExts && Object.keys(r.editedExts).length)
      extras += `<div class="sect"><div class="sect-h">Files edited by type</div><div class="chips">` +
        topEntries(r.editedExts, 12).map(([e,n])=>`<span class="chip">.${esc(e)} · ${fmtN(n)}</span>`).join("") + `</div></div>`;
    if (r.cmdDomains && Object.keys(r.cmdDomains).length)
      extras += `<div class="sect"><div class="sect-h">Shell domains driven</div><div class="chips">` +
        topEntries(r.cmdDomains, 10).map(([d,n])=>`<span class="chip">${esc(d)} · ${fmtN(n)}</span>`).join("") + `</div></div>`;
    if ((r.mcpToolsUsed||[]).length)
      extras += `<div class="sect"><div class="sect-h">MCP integrations invoked</div><div class="chips">` +
        r.mcpToolsUsed.map(s=>`<span class="chip">${esc(s)}</span>`).join("") + `</div></div>`;
  }
  if (t.id === "codex"){
    const mm = topEntries(r.models, 6);
    if (mm.length) extras += `<div class="sect"><div class="sect-h">Models</div>${barList(mm, color)}</div>`;
    if ((r.originators||[]).length)
      extras += `<div class="sect"><div class="sect-h">Surfaces</div><div class="chips">` +
        r.originators.map(s=>`<span class="chip">${esc(s)}</span>`).join("") + `</div></div>`;
  }
  if (t.id === "copilot" && (r.modelIds||[]).length)
    extras += `<div class="sect"><div class="sect-h">Models selected in chat</div><div class="chips">` +
      r.modelIds.map(s=>`<span class="chip">${esc(s)}</span>`).join("") + `</div></div>`;

  const projects = (t.projects||[]).length ?
    `<div class="sect"><div class="sect-h">Projects touched</div><div class="chips">` +
    t.projects.map(p=>`<span class="chip">${esc(p)}</span>`).join("") + `</div></div>` : "";
  const notes = (t.notes||[]).map(n=>`<div class="note">${esc(n)}</div>`).join("");

  el.innerHTML = head + `<div class="sect">${mgrid}</div>` + extras + projects + (notes?`<div class="sect">${notes}</div>`:"");
  el.addEventListener("mousemove", e => {
    const hc = e.target.closest(".hour-col");
    if (hc){ tipShow(`<b>${String(hc.dataset.h).padStart(2,"0")}:00</b> — ${hc.dataset.v} prompts`, e.clientX, e.clientY); }
    else tipHide();
  });
  el.addEventListener("mouseleave", tipHide);
}

/* ---------- methodology panel ---------- */
(function method(){
  const el = document.getElementById("p-method");
  const rows = [
    ["Claude Code", "~/.claude/projects/*/*.jsonl · history.jsonl · settings.json · ~/.claude.json", "sessions, prompts, tool calls, subagents, workflows, tokens, MCP, skills/hooks"],
    ["OpenAI Codex", "~/.codex/sessions/**/rollout-*.jsonl · history.jsonl · config.toml", "sessions, prompts, tool calls, surfaces, models, config depth"],
    ["Cursor", "Cursor/User/globalStorage/state.vscdb · workspaceStorage/*/state.vscdb", "prompts, generations, composer/agent sessions, chat tabs"],
    ["Antigravity", "Antigravity/User/globalStorage + workspaceStorage state.vscdb", "agent conversations, chat sessions, projects (server-side history not visible)"],
    ["GitHub Copilot", "VS Code workspaceStorage/*/chatSessions · chatEditingSessions · extensions · github-copilot auth", "chat sessions/requests, agent edits, models (inline completions not persisted)"],
  ];
  const weights = [["Tool breadth","10%"],["Power-user depth","22%"],["Consistency","18%"],["Technical knowledge","15%"],["Agentic leverage","22%"],["Prompt craft","13%"]];
  el.innerHTML = `
    <div class="sect"><div class="sect-h">What was scanned</div>
      <div class="method"><div class="tbl-wrap"><table>
        <thead><tr><th>Tool</th><th>Local sources read</th><th>Signals extracted</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="mono">${esc(r[1])}</td><td class="mono">${esc(r[2])}</td></tr>`).join("")}</tbody>
      </table></div></div></div>
    <div class="sect"><div class="sect-h">Scoring weights</div>
      <div class="method"><div class="tbl-wrap"><table>
        <thead><tr><th>Axis</th><th>Weight</th></tr></thead>
        <tbody>${weights.map(w=>`<tr><td>${w[0]}</td><td class="mono">${w[1]}</td></tr>`).join("")}</tbody>
      </table></div></div></div>
    <div class="sect"><div class="sect-h">Privacy</div>
      <div class="priv"><b>Aggregates only.</b> The profiler reads counts, timestamps, durations, model and
      tool names, and per-prompt structural markers (code blocks, file paths, list structure, constraint words) plus prompt <i>lengths</i>. It never reads or transmits prompt text, code, file contents,
      credentials, or API keys, and the report is a static file that makes no network requests.
      ${P.meta.redacted ? "Project names were redacted at generation time." : "Project names show folder basenames only."}</div></div>
    <div class="sect"><div class="sect-h">Limitations</div>
      <p class="sect-sub">Local traces under-count cloud-side work (Codex cloud tasks, Antigravity server history,
      Copilot inline completions) and say nothing about output quality — pair this dossier with a live working
      session before deciding. A near-empty dossier can also mean a new machine: check first-seen dates.</p></div>`;
})();

const initial = location.hash.slice(1);
show(SECTIONS.some(s => s.id === initial) ? initial : "overview");
</script>
